    name: main_ppo
    chdir: null
    override_dirname: actor_rollout_ref.actor.clip_ratio_high=0.28,actor_rollout_ref.actor.fsdp_config.optimizer_offload=False,actor_rollout_ref.actor.fsdp_config.param_offload=False,actor_rollout_ref.actor.optim.lr=1e-6,actor_rollout_ref.actor.ppo_max_token_len_per_gpu=5000,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=2,actor_rollout_ref.actor.ppo_mini_batch_size=128,actor_rollout_ref.actor.use_dynamic_bsz=False,actor_rollout_ref.actor.use_kl_loss=False,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=Parallel-R1/Parallel-SFT-Unseen,actor_rollout_ref.model.use_remove_padding=False,actor_rollout_ref.ref.log_prob_max_token_len_per_gpu=5000,actor_rollout_ref.ref.log_prob_use_dynamic_bsz=False,actor_rollout_ref.rollout.agent.max_iterations_for_parallel_thinking=4,actor_rollout_ref.rollout.agent.max_path_response_length=4096,actor_rollout_ref.rollout.agent.num_paths=2,actor_rollout_ref.rollout.agent.num_workers=32,actor_rollout_ref.rollout.gpu_memory_utilization=0.7,actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu=5000,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=4,actor_rollout_ref.rollout.log_prob_use_dynamic_bsz=False,actor_rollout_ref.rollout.mode=async,actor_rollout_ref.rollout.n=8,actor_rollout_ref.rollout.name=vllm,actor_rollout_ref.rollout.tensor_model_parallel_size=1,actor_rollout_ref.rollout.top_k=-1,actor_rollout_ref.rollout.top_p=1.0,actor_rollout_ref.rollout.val_kwargs.do_sample=True,actor_rollout_ref.rollout.val_kwargs.n=1,actor_rollout_ref.rollout.val_kwargs.temperature=1.0,actor_rollout_ref.rollout.val_kwargs.top_k=-1,actor_rollout_ref.rollout.val_kwargs.top_p=1.0,algorithm.adv_estimator=grpo,algorithm.gamma=1,algorithm.lam=1,algorithm.use_kl_in_reward=False,data.filter_overlong_prompts=False,data.max_prompt_length=2000,data.max_response_length=3000,data.return_raw_chat=True,data.train_batch_size=256,data.train_files=['./data_preprocess_scripts/data/dapo/adaptive_parallel_thinking_fina