    - actor_rollout_ref.rollout.top_p=1.0
    - actor_rollout_ref.rollout.top_k=-1
    - actor_rollout_ref.rollout.val_kwargs.temperature=1.0
    - actor_rollout_ref.rollout.val_kwargs.top_p=1.0
    - actor_rollout_ref.rollout.val_kwargs.top_k=-1
    - actor_rollout_ref.rollout.val_kwargs.do_sample=True
    - actor_rollout_ref.rollout.val_kwargs.n=1
    - trainer.logger=[console,wandb]
    - trainer.project_name=Parallel-R1
    - trainer.experiment_name=Parallel-R1-Unseen-S2-freq-20
    - trainer.n_gpus_per_node=2
    - trainer.nnodes=1
    - trainer.save_freq=10
    - trainer.test_freq=2
    - trainer.total_epochs=100
    - trainer.validation_data_dir=./Parallel-R1/Parallel-R1-Unseen-S2-freq-20/validation-log
    - trainer.rollout_data_dir=./Parallel-R1/Parallel-R1-Unseen-S2-freq-20/rollout-log
    - trainer.default_local_dir=./Parallel-R1/Parallel-R1-Unseen-S2-freq-20
    - trainer.val_before_train=False
    - trainer.resume_mode=auto
